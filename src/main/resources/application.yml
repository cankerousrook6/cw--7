spring:
  application:
    name: payment-system

  datasource:
    url: jdbc:h2:file:./data/payment_system
    username: sa
    password:
    driver-class-name: org.h2.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    kg.attractor.payment_system: INFO
  file:
    name: logs/payment-system.log

server:
  port: 8080
